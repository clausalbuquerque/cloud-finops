[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-finops-ai-agents"
version = "0.1.0"
description = "Python AI agent services for Cloud FinOps retrieval and embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers==3.0.1",
  "truststore==0.10.4",
  "einops==0.8.1",
  "sqlalchemy==2.0.43",
  "requests==2.32.5",
  "beautifulsoup4==4.14.2",
  "pypdf==6.0.0",
  "psycopg[binary]>=3.3.4",
  "crewai[google-genai]>=1.15",
  "python-dotenv>=1.0",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.4",
  "crewai-tools>=0.76.0",
  "mcp>=1.28.1",
  "litellm>=1.98.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["finops_ai*"]
